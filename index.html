<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080B12" />
    <meta
      name="description"
      content="The ColorStack Tech League at Georgia State University: a semester-long, points-based technical development program. Five challenge types, a live leaderboard, and a capstone hackathon judged by partner engineers."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The font request used to be an @import at the top of index.css, which
         meant the browser could not ask for it until it had downloaded and
         parsed that stylesheet. Requesting it here starts it immediately, on
         the connections the preconnects above have already opened. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap"
    />
    <title>ColorStack Tech League @ GSU</title>
    <link rel="canonical" href="https://techleague.colorstackatgsu.com/" />

    <!-- The flyer's QR code and every link pasted into GroupMe, Discord or an
         Instagram bio unfurl from these. Without them a shared link renders as
         a blank grey card, which is most of how this site gets found. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ColorStack Tech League @ GSU" />
    <meta property="og:url" content="https://techleague.colorstackatgsu.com/" />
    <meta property="og:title" content="ColorStack Tech League @ GSU" />
    <meta
      property="og:description"
      content="A semester-long, team-based competition at Georgia State. Teams of 3-4 tackle five milestones, rack up points on a live leaderboard, and finish with a Capstone Hackathon."
    />
    <meta property="og:image" content="https://techleague.colorstackatgsu.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ColorStack Tech League at Georgia State University, in partnership with CS Club and progsu."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
